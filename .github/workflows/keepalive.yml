# Every 15 minutes: probe Cloud + the public frontend.
# If the app is dead, open a GitHub issue, reflex deploy (not start/stop),
# then comment and close the issue when Cloud says Running.
#
# Secrets (Settings → Secrets and variables → Actions):
#   REFLEX_TOKEN     reflex cloud create-token github-actions --duration 90
#   REFLEX_ENVFILE   full text of local .env (so deploy does not wipe Cloud secrets)
#
# Watch the repo (or Issues) to get email on issue open / comment / close.

name: Keepalive worker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: Deploy even if probes look healthy
        type: boolean
        default: false

concurrency:
  group: keepalive-worker
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  APP_ID: 58d9680e-4c9d-4d5c-8e00-bebaefdb177d
  FRONTEND_URL: https://dss-clustering.reflex.run
  PYTHONUNBUFFERED: "1"

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Reflex CLI
        run: pip install "reflex==0.9.8"

      - name: Require REFLEX_TOKEN
        id: token
        env:
          REFLEX_TOKEN: ${{ secrets.REFLEX_TOKEN }}
        run: |
          if [ -z "$REFLEX_TOKEN" ]; then
            echo "reason=Repository secret REFLEX_TOKEN is missing" >> "$GITHUB_OUTPUT"
            echo "::error::Add repository secret REFLEX_TOKEN (reflex cloud create-token ...)."
            exit 1
          fi

      - name: Inspect Cloud app
        id: inspect_app
        env:
          REFLEX_TOKEN: ${{ secrets.REFLEX_TOKEN }}
        run: |
          set +e
          reflex cloud apps inspect "$APP_ID" --token "$REFLEX_TOKEN" --no-interactive --json > inspect.raw 2> inspect.err
          code=$?
          set -e
          if [ -s inspect.err ]; then
            echo "CLI stderr:" >&2
            cat inspect.err >&2
          fi
          if [ "$code" -ne 0 ]; then
            echo "reason=reflex cloud apps inspect failed (exit $code)" >> "$GITHUB_OUTPUT"
            echo "::error::reflex cloud apps inspect failed with exit $code."
            cat inspect.raw >&2
            exit "$code"
          fi
          python .github/scripts/check_worker.py --extract-inspect inspect.raw inspect.json

      - name: Probe worker
        id: probe
        env:
          FORCE_DEPLOY: ${{ github.event.inputs.force_deploy }}
        run: |
          extra=""
          if [ "$FORCE_DEPLOY" = "true" ]; then
            extra="--force-deploy"
          fi
          set +e
          python .github/scripts/check_worker.py inspect.json $extra
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            echo "App looks healthy."
            exit 0
          fi
          if [ "$code" -eq 11 ]; then
            echo "Dependencies unhealthy; not deploying."
            exit 1
          fi
          if [ "$code" -eq 10 ]; then
            echo "App looks dead."
            exit 0
          fi
          exit "$code"

      - name: Close keepalive issue if already healthy
        if: steps.probe.outputs.needs_deploy != 'true' && steps.probe.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: |
            Recovered: probes are healthy again (${{ steps.probe.outputs.reason }}).
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          chmod +x .github/scripts/keepalive_issue.sh
          num="$(.github/scripts/keepalive_issue.sh find || true)"
          if [ -n "${num:-}" ]; then
            .github/scripts/keepalive_issue.sh close
          fi

      - name: Open or update down issue
        id: issue
        if: steps.probe.outputs.needs_deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: |
            The live app looks down.
            - reason: `${{ steps.probe.outputs.reason }}`
            - frontend: ${{ env.FRONTEND_URL }}
            - run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            A Reflex Cloud deploy will be attempted next (unless cooldown blocks it).
        run: |
          chmod +x .github/scripts/keepalive_issue.sh
          num="$(.github/scripts/keepalive_issue.sh open)"
          echo "number=$num" >> "$GITHUB_OUTPUT"

      - name: Restore deploy cooldown stamp
        if: steps.probe.outputs.needs_deploy == 'true'
        uses: actions/cache/restore@v5
        with:
          path: .keepalive-deploy
          key: keepalive-deploy-${{ github.run_id }}
          restore-keys: |
            keepalive-deploy-

      - name: Deploy to Reflex Cloud
        id: deploy
        if: steps.probe.outputs.needs_deploy == 'true'
        env:
          REFLEX_TOKEN: ${{ secrets.REFLEX_TOKEN }}
          REFLEX_ENVFILE: ${{ secrets.REFLEX_ENVFILE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_DEPLOY: ${{ github.event.inputs.force_deploy }}
          COOLDOWN_SEC: "3600"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          now=$(date +%s)
          if [ "$FORCE_DEPLOY" != "true" ] && [ -f .keepalive-deploy ]; then
            then=$(cat .keepalive-deploy)
            age=$((now - then))
            if [ "$age" -lt "$COOLDOWN_SEC" ]; then
              echo "Last deploy was ${age}s ago (cooldown ${COOLDOWN_SEC}s)."
              ISSUE_BODY="Still down. Skipping deploy (cooldown ${COOLDOWN_SEC}s, last deploy ${age}s ago). Run: $RUN_URL" \
                .github/scripts/keepalive_issue.sh comment || true
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
          if [ -z "$REFLEX_ENVFILE" ]; then
            echo "::error::Add repository secret REFLEX_ENVFILE (full local .env). An empty file would wipe Cloud secrets."
            .github/scripts/keepalive_issue.sh comment "Deploy aborted: repository secret REFLEX_ENVFILE is missing." || true
            exit 1
          fi
          printf '%s\n' "$REFLEX_ENVFILE" > .env
          ISSUE_BODY="Deploying from run $RUN_URL" .github/scripts/keepalive_issue.sh comment || true
          reflex deploy --config cloud.yml --no-interactive --project-name "Default Project" --token "$REFLEX_TOKEN" --envfile .env --description "Keepalive auto-deploy" \
            --exclude-from-backend master_dataset.pkl \
            --exclude-from-backend lemma.py \
            --exclude-from-backend morphological.py \
            --exclude-from-backend _spec_extracted.txt \
            --exclude-from-backend hebrew_stylometry_webapp_specification.docx \
            --exclude-from-backend tests \
            --exclude-from-backend scripts \
            --exclude-from-backend .pytest_cache \
            --exclude-from-backend .agents \
            --exclude-from-backend .states \
            --exclude-from-backend .git \
            --exclude-from-backend .venv \
            --exclude-from-backend .web
          rm -f .env
          echo "$now" > .keepalive-deploy
          echo "Waiting for Cloud status..."
          sleep 20
          set +e
          reflex cloud apps inspect "$APP_ID" --token "$REFLEX_TOKEN" --no-interactive --json > inspect.raw 2> inspect.err
          set -e
          python .github/scripts/check_worker.py --extract-inspect inspect.raw inspect.json
          python .github/scripts/check_worker.py inspect.json --require-healthy

      - name: Save deploy cooldown stamp
        if: steps.deploy.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: .keepalive-deploy
          key: keepalive-deploy-${{ github.run_id }}

      - name: Comment recovered and close issue
        if: steps.deploy.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: |
            Recovered: Cloud status is Running after deploy.
            Frontend: ${{ env.FRONTEND_URL }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          chmod +x .github/scripts/keepalive_issue.sh
          .github/scripts/keepalive_issue.sh close

      - name: Comment deploy failed
        if: steps.probe.outputs.needs_deploy == 'true' && steps.deploy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: |
            Deploy did not leave the app healthy. The issue stays open.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          chmod +x .github/scripts/keepalive_issue.sh
          .github/scripts/keepalive_issue.sh comment || true

      - name: Job summary
        if: always()
        run: |
          REASON='${{ steps.probe.outputs.reason }}'
          DEPLOY='${{ steps.probe.outputs.needs_deploy }}'
          TOKEN_REASON='${{ steps.token.outputs.reason }}'
          INSPECT_REASON='${{ steps.inspect_app.outputs.reason }}'
          if [ -z "$REASON" ]; then
            REASON="${TOKEN_REASON:-${INSPECT_REASON:-Probe did not run.}}"
          fi
          if [ -z "$DEPLOY" ]; then
            DEPLOY="false"
          fi
          {
            echo "## Keepalive"
            echo "- reason: \`${REASON}\`"
            echo "- needs deploy: \`${DEPLOY}\`"
            echo "- frontend: $FRONTEND_URL"
          } >> "$GITHUB_STEP_SUMMARY"
